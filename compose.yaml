name: lab1

services:
  db:
    build: .
    image: lab1-postgres:18
    environment:
      POSTGRES_DB: lab_db
      POSTGRES_PASSWORD: postgres_demo_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=ru_RU.UTF-8 --auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab_db"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:

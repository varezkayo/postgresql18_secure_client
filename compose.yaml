services:
  db:
    image: postgres:18-bookworm
    env_file: [db.env, demo.env]
    environment:
      POSTGRES_DB: seminar_db
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - db_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-user.sh:ro
  pinger:
    build: .
    image: seminar-pinger:2
    env_file: demo.env
    volumes:
      - logs:/app/logs
volumes:
  db_data:
  logs:

services:
  db:
    image: postgres:18-bookworm
    env_file: db.env
    environment:
      POSTGRES_DB: bookshop
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - db_data:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d bookshop"]
      interval: 2s
      timeout: 2s
      retries: 30
  app:
    build: .
    image: seminar-bookshop:3
    env_file: demo.env
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - logs:/app/logs
volumes:
  db_data:
  logs:
